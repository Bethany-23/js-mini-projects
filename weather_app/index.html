<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter a city name" id="input" spellcheck="false">
            <button>Search</button>
        </div>
    </div>
    <div class="weather">
        <h1 class="temp">22 degrees</h1>
        <h2 class="city">New York</h2>
        <div class="details">
            <div class="col">
                <div>
                    <p class="humidity"> 50%</p>
                    <p>humidity</p>
                </div>
            </div>
              <div class="col">
                <div>
                    <p class="wind"> 20 km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
